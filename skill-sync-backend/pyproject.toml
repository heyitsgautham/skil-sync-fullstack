[project]
name = "skillsync-backend"
version = "0.1.0"
description = "FastAPI backend for SkillSync, an AI-assisted internship matching platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Web framework and server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy==1.4.53",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    # Authentication and security
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    # Validation
    "pydantic[email]>=2.7",
    # Document processing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    # Cloud storage
    "boto3>=1.34",
    # AI, embeddings and vector store
    "google-genai>=1.0",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.3",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pip-audit>=2.7",
    "ruff>=0.6",
]

[tool.uv]
package = false

# Linux installs (Docker, CI) take CPU-only torch wheels instead of the
# multi-gigabyte CUDA build. macOS and Windows use the default PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pydantic.warnings.PydanticDeprecatedSince20"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend-integration", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines are left to the formatter
    "B008",  # FastAPI uses Depends() in argument defaults by design
    "B904",  # existing handlers re-raise HTTPException without chaining
    "E711",  # SQLAlchemy filters need `== None`
    "E712",  # SQLAlchemy filters need `== True`
    "UP042",  # StrEnum changes str() of the role and status enums, which the API and DB rely on
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # scripts add the backend root to sys.path before importing app
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "preserve"
