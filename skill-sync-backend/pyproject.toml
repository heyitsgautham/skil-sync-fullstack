[project]
name = "skillsync-backend"
version = "0.1.0"
description = "FastAPI backend for SkillSync, an AI-assisted internship matching platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Web framework and server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy==1.4.53",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    # Authentication and security
    "passlib[bcrypt]==1.7.4",
    "bcrypt==5.0.0",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    # Validation
    "pydantic[email]>=2.7",
    # Document processing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    # Cloud storage
    "boto3>=1.34",
    # AI, embeddings and vector store
    "google-genai>=1.0",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.3",
    "numpy>=1.26",
]

[tool.uv]
package = false

# Linux installs (Docker, CI) take CPU-only torch wheels instead of the
# multi-gigabyte CUDA build. macOS and Windows use the default PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
